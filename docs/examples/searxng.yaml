manifest_version: 1
service:
  id: demo-searxng
  name: SearXNG
  description: SearXNG — privacy-friendly metasearch engine (Python)
source:
  git: https://github.com/searxng/searxng.git
  commit: 18af21159bd7b84880cd7265b184825493322232
prefetch:
- - python3
  - -m
  - pip
  - download
  - -r
  - requirements.txt
  - -r
  - requirements-server.txt
  - -d
  - .ghost-cache/pip-wheelhouse
  - '--only-binary=:all:'
- touch .ghost-cache/pip-wheelhouse/.done
build:
  profile: python
  steps:
  - python3 -m venv --clear .venv
  - .venv/bin/pip install --no-cache-dir -r requirements.txt -r requirements-server.txt
run:
  command:
  - '{venv}'
  - -m
  - granian
  - searx.webapp:app
  - --host
  - 127.0.0.1
  - --port
  - '{port}'
  port: 8888
  env:
    GRANIAN_INTERFACE: wsgi
    SEARXNG_SECRET: '{secret}'
resources:
  memory_high: 768M
  memory_max: 1536M
  tasks_max: '512'
  cpu_quota: 100%
  limit_nofile: 65536
  oom_score_adjust: -100
healthcheck:
  type: http
  path: /
tools:
- python3
egress:
  allow:
  - www.bing.com
  - duckduckgo.com
  - html.duckduckgo.com
  - www.google.com
  - www.startpage.com
  - search.brave.com
  - en.wikipedia.org
  - www.wikidata.org
  auto: true
