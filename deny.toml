# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Gate: `cargo deny check` (advisories + bans + licenses) should pass before
# pushing any tag. Run locally with `cargo install cargo-deny --locked` and,
# via the workflow in .github/workflows/ci.yml.

[advisories]
version = 2
# No stale ignores: the TUI stack now sits on ratatui 0.30 (lru 0.18.4), which
# cleared the previously-ignored RUSTSEC-2024-0436/paste and the lru "unsound"
# advisories. Keep this list empty unless a real, justified exception exists.

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # Own crate: custom source-available text in LICENSE (see license-file in
    # Cargo.toml). Declared as LicenseRef-Proprietary so `cargo deny check
    # licenses` can match it instead of flagging the crate as unlicensed.
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.8
