# CI gate for every push/PR: lint, test, and a dependency advisory/license
# audit via cargo-deny. The release path (signed static musl build) lives in
# release.yml and is intentionally separate: CI here fails fast on the cheap
# checks and never publishes anything.
#
# Actions are pinned by full commit SHA to control supply-chain drift; bump a
# SHA only by recording the reason in the commit message (same discipline as
# release.yml).

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain (MSRV 1.88)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88"
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      # Fail on warnings, deny-by-default clippy lints, and cross-check tests.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo fmt --check
      - name: Test (lib)
        run: cargo test --lib

      - name: Test (integration)
        run: cargo test --test '*' -- --test-threads=1

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain (latest stable for cargo-deny)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
