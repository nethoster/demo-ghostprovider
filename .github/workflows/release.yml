# Static musl release build, triggered by pushing a `v*` tag.
#
# Supply-chain discipline mirrors scripts/build-musl.sh:
#   * the build happens inside the SAME pinned-by-digest Arch container,
#   * dependencies resolve strictly against the committed Cargo.lock,
#   * actions are pinned by full commit SHA (never a mutable tag),
#   * the minisign signature is created LOCALLY (scripts/release-local.sh
#     --sign) and committed as release/SHA256SUMS + release/SHA256SUMS.minisig.
#     The signing key therefore never lives on GitHub; CI only *verifies*
#     against docs/release.pub (in-tree) — a release without the committed
#     signature FAILS, it is never published unsigned.
#
# Verification step:
#   1. release/SHA256SUMS.minisig must exist for the pushed tag,
#   2. minisign -Vm release/SHA256SUMS -p docs/release.pub must pass,
#   3. the CI-built binary's checksums must equal the committed ones
#      (sha256sum -c) — the reproducibility audit that ties the locally
#      signed artifact to what this workflow built.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: none

env:
  BIN: demo-ghostprovider

jobs:
  static-musl:
    runs-on: ubuntu-latest
    container:
      # Pinned by digest — identical to scripts/build-musl.sh and
      # scripts/release-local.sh. Bump all three together, consciously,
      # and record the bump in the commit message.
      image: ghcr.io/archlinux/archlinux@sha256:f0e768f473fdef45e43f0d33edd2138bd6f72fd59039f202870a5ed9367497e5
    env:
      VERSION: ${{ github.ref_name }}
      # Fixed build locations, identical to scripts/release-local.sh: rustc
      # embeds absolute paths (registry sources, crate root) into the binary,
      # so /cargo + /src are what make local and CI builds byte-identical.
      CARGO_HOME: /cargo
    steps:
      - name: Install pinned toolchain
        run: |
          set -eu
          pacman -Syu --noconfirm --needed git rustup musl minisign
          # Pinned, not `stable`: byte-identical releases require the same
          # rustc here and in scripts/release-local.sh. Bump both together.
          rustup default 1.98.0
          rustup target add x86_64-unknown-linux-musl

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags: the "Compose release notes" step resolves the
          # previous tag (git describe) and the annotated tag body, which
          # require tags to exist locally.
          fetch-depth: 0
          fetch-tags: true

      - name: Build (--locked, static)
        run: |
          set -eu
          mkdir -p /cargo /src
          cp -a . /src
          cd /src
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Stage artifacts
        run: |
          set -eu
          mkdir -p dist
          cp "/src/target/x86_64-unknown-linux-musl/release/${BIN}" \
             "dist/${BIN}-${VERSION}-x86_64-linux-musl"
          ( cd dist && sha256sum "${BIN}-${VERSION}-x86_64-linux-musl" > SHA256SUMS )
          # dist/* becomes the release assets, so the committed local-only
          # signature must ride along: install.sh verifies SHA256SUMS.minisig
          # against the checksums it downloaded.
          cp release/SHA256SUMS.minisig dist/

      - name: Verify committed signature + reproducible checksums
        run: |
          set -eu
          test -f release/SHA256SUMS || {
            echo "::error::release/SHA256SUMS is missing. Releases must be signed locally (scripts/release-local.sh --sign) and release/SHA256SUMS committed before pushing the tag."
            exit 1
          }
          test -f release/SHA256SUMS.minisig || {
            echo "::error::release/SHA256SUMS.minisig is missing. Local-only signing policy: an unsigned release is refused, never published."
            exit 1
          }
          echo "::group::Verifying minisign signature (docs/release.pub)"
          minisign -Vm release/SHA256SUMS -p docs/release.pub || {
            echo "::error::signature verification failed for release/SHA256SUMS"
            exit 1
          }
          echo "::endgroup::"
          echo "::group::Reproducibility: CI-built checksums must match the signed, committed ones"
          # dist/SHA256SUMS is what this workflow computed; the signed file is
          # what a maintainer computed locally. Byte-identical builds ⇒ equal.
          ( cd dist && sha256sum -c ../release/SHA256SUMS ) || {
            echo "::error::CI-produced binary does not match the locally signed checksums (non-reproducible build?)"
            exit 1
          }
          echo "::endgroup::"

      - name: Compose release notes
        run: |
          TAG="${{ github.ref_name }}"
          SRC="none"
          BODY=""
          # Prefer curated committed notes, then the annotated tag body, then
          # the commit history. Every git probe is guarded so a missing tag or
          # shallow history can never fail the release.
          if [ -f "release/notes/${TAG}.md" ]; then
            BODY="$(cat "release/notes/${TAG}.md")"
            SRC="committed-notes"
          elif git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null | sed '/^[[:space:]]*$/d' > /tmp/notes_body.txt && [ -s /tmp/notes_body.txt ]; then
            BODY="$(cat /tmp/notes_body.txt)"
            SRC="annotated-tag"
          fi
          if [ -z "$BODY" ]; then
            PREV="$(git describe --abbrev=0 --tags "${TAG}^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              if BODY="$(git log --format='- %s' "${PREV}..${TAG}" 2>/dev/null)"; then SRC="commit-log"; else BODY=""; fi
            else
              if BODY="$(git log --format='- %s' "$TAG" 2>/dev/null)"; then SRC="commit-log-all"; else BODY=""; fi
            fi
          fi
          : > /tmp/release_body.md
          if [ -n "$BODY" ]; then
            printf '%s\n' "$BODY" > /tmp/release_body.md
          fi
          echo "::warning::release-notes source=$SRC tag=$TAG taghits=$(git tag -l "$TAG" 2>/dev/null | wc -l | tr -d ' ') body_bytes=$(wc -c < /tmp/release_body.md | tr -d ' ')"

      - name: Resolve release token
        id: reltok
        env:
          # Used only by the liveness probe below; never echoed.
          SECRET_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -eu
          # Prefer the maintainer PAT so releases publish under the
          # maintainer identity, but only after proving it authenticates: a
          # stale GH_RELEASE_TOKEN used to reach this point with every
          # verification already green and then fail the whole run with
          # "Bad credentials", stranding the release. Fall back to the
          # workflow's built-in token (permissions: contents: write) so a
          # dead secret can never block publishing again.
          if [ -n "${SECRET_TOKEN}" ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SECRET_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user)"
            if [ "${code}" = "200" ]; then
              echo "kind=secret" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          echo "kind=builtin" >> "${GITHUB_OUTPUT}"

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Maintainer PAT when it is valid, otherwise the built-in token
          # (this job already has permissions: contents: write) — publishing
          # as github-actions[bot] beats never publishing at all.
          token: ${{ steps.reltok.outputs.kind == 'secret' && secrets.GH_RELEASE_TOKEN || github.token }}
          # Explicit body from the annotated tag message / commit history,
          # never GitHub's PR-based auto-notes (empty for direct-commit repos).
          body_path: /tmp/release_body.md
          # dist/* = binary + SHA256SUMS computed by THIS run. The signed
          # release/SHA256SUMS(.minisig) were already verified above.
          fail_on_unmatched_files: true
          files: dist/*
