[package]
name = "demo-ghostprovider"
version = "0.0.38"
edition = "2024"
rust-version = "1.88"
description = "Local-first demo hosting panel: deploy three curated self-hosted services as hardened systemd user services. Rust rewrite of demo-ghostprovider."
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
flate2 = "1"
libc = "0.2"
ratatui = "0.30"
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
webpki-roots = "1"
tar = "0.4"
ureq = { version = "3.4.1", default-features = false, features = ["rustls", "gzip", "charset"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "demo-test"
path = "src/bin/demo_test.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = "z"
